name: Linux 📦 (manylinux)

on:
  push:
    tags:
      - "v*.*.*"
    branches: [ manylinux, build-all ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manylinux:
    name: Build manylinux wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Cubism SDK
        uses: actions/cache@v4
        with:
          path: |
            Live2D/V3/Core
            Live2D/V3/Framework
          key: csmsdk-${{ hashFiles('setup.py') }}

      - name: Build wheels in manylinux container
        run: |
          docker run --rm \
            -v $PWD:/work -w /work \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -c '
            set -e
            yum install -y mesa-libGL-devel gcc-c++

            # use system GCC 8.5 (matches GLIBC 2.28), not devtoolset GCC 14
            export CC=/usr/bin/gcc CXX=/usr/bin/g++

            # clear stale cmake cache
            rm -rf build/

            # Install cmake once
            /opt/python/cp311-cp311/bin/pip install cmake
            export PATH="/opt/python/cp311-cp311/bin:$PATH"

            # Stable-ABI build: one cp311-abi3 wheel covers Python >= 3.11
            PYBIN=/opt/python/cp311-cp311/bin
            "$PYBIN/pip" install --upgrade setuptools wheel packaging
            "$PYBIN/python" setup.py bdist_wheel
            "$PYBIN/python" setup.py sdist

            mkdir -p raw
            mv dist/*.whl raw/

            for whl in raw/*.whl; do
              auditwheel repair "$whl" -w dist/
            done

            # Verify: metadata check + install + import with the building interpreter
            "$PYBIN/pip" install twine
            "$PYBIN/python" -m twine check dist/*.whl
            "$PYBIN/pip" install --force-reinstall dist/*.whl
            "$PYBIN/python" -c "import live2d.v2cpp, live2d.v3"

            # Fix file ownership for host
            chown -R $(stat -c "%u:%g" /work) /work/dist /work/build

            echo "=== Built wheels ==="
            ls dist/
            echo ""
            for whl in dist/*.whl; do
              echo "--- $whl ---"
              auditwheel show "$whl" 2>&1 || true
            done
          '

      - name: Upload wheels to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
          
      - name: Publish sdist and wheel to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python -m pip install twine
          twine upload dist/*.tar.gz --skip-existing
          twine upload dist/*.whl --skip-existing
