name: MacOS-arm64 📦

on:
  push:
    tags:
      - "v*.*.*"
    branches: [ macos-workflow, build-all ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-n-publish:
    name: Build📦 for MacOS
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Stable-ABI build: a single cp311-abi3 wheel covers Python >= 3.11
          python-version: '3.11'
          cache: pip

      - name: Cache Cubism SDK
        uses: actions/cache@v4
        with:
          path: |
            Live2D/V3/Core
            Live2D/V3/Framework
          key: csmsdk-${{ hashFiles('setup.py') }}

      - name: Install build deps
        run: |
          python -m pip install -c .github/constraints.txt setuptools wheel

      - name: Build a binary wheel
        run: python setup.py bdist_wheel

      - name: Test Run (v2, v2cpp, v3)
        run: |
          pip install pyside6 pyopengl numpy pillow
          cd package
          python test_run_screenshot.py v2   --model haru --output screenshot_v2.png
          python test_run_screenshot.py v2cpp --model haru --output screenshot_v2cpp.png
          python test_run_screenshot.py v3   --model haru --output screenshot_v3.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: package/screenshot_*.png

      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python -m pip install twine
          twine upload dist/* --skip-existing

      - name: Upload Wheel to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
