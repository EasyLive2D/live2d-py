name: Windows-intel📦

on:
  push:
    tags:
      - "v*.*.*"
    branches: [ windows-workflow, build-all ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-n-publish:
    name: Build📦 for Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Stable-ABI build: a single cp311-abi3 wheel covers Python >= 3.11
          python-version: '3.11'
          architecture: x64

      - name: Cache Cubism SDK
        uses: actions/cache@v4
        with:
          path: |
            Live2D/V3/Core
            Live2D/V3/Framework
          key: csmsdk-${{ hashFiles('setup.py') }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade setuptools wheel

      - name: Build a binary wheel
        run: python setup.py bdist_wheel

      - name: Verify wheel
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install twine
          python -m twine check $wheel
          python -m pip install --force-reinstall $wheel
          python -c "import live2d.v2cpp, live2d.v3"

      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload dist/* --skip-existing

      - name: Upload Wheel to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
